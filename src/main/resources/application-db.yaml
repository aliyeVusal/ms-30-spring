spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ms-data-jpa
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true